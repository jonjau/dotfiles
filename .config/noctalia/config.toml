[backdrop]
enabled = true

[bar]
order = [ "default" ]

    [bar.default]
    capsule_radius = 0
    center = [ "date", "clock" ]
    concave_edge_corners = false
    end = [ "media", "group:g1", "notifications", "network", "volume", "clipboard", "brightness", "battery", "session" ]
    margin_ends = 0
    radius = 0
    start = [ "launcher", "group:g2" ]
    thickness = 32
    widget_spacing = 12

        [bar.default.dead_zone.actions]
        left = "panel-toggle control-center home"

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "outline"
        id = "g1"
        members = [ "cpu", "ram" ]
        opacity = 1.0
        padding = 6.0
        radius = 1.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "outline"
        id = "g2"
        members = [ "workspaces" ]
        opacity = 1.0
        padding = 6.0
        radius = 0.0

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
app_icon_colorize = true
corner_radius_scale = 0.0
font_family = "IosevkaTerm Nerd Font Mono"
niri_overview_type_to_launch_enabled = true
settings_show_advanced = true

[theme]
community_palette = "Creamy Forest"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "foot", "gtk3", "gtk4", "niri" ]
    community_ids = [ "neovim", "fuzzel", "fastfetch", "lazygit", "yazi" ]

[wallpaper.default]
path = "/home/jon/Pictures/Wallpapers/shishkin.jpg"

[wallpaper.last]
path = "/home/jon/Pictures/Wallpapers/shishkin.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/jon/Pictures/Wallpapers/shishkin.jpg"

[widget.battery]
display_mode = "none"

[widget.brightness]
enabled = false

[widget.control-center]
glyph = "no-derivatives"

[widget.cpu]
label_min_width = 24
visualization = "none"

[widget.date]
format = "{:%d %b}"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.notifications]
enabled = false

[widget.ram]
label_min_width = 60
visualization = "none"

[widget.volume]
mute_color = "on_tertiary"
show_label = false

[widget.workspaces]
style = "minimal"
