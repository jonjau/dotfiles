# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file with r (change file location to your the tmux.conf you want to use)
bind r source ~/.config/tmux/tmux.conf\; display "tmux.conf sourced!"

# switch panes using vim motions
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# vi keybindings for copy mode
set -g mode-keys vi

# on mouse release in copy mode, copy to tmux buffer and system clipboard (wayland)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "wl-copy"

# allow OSC 52 clipboard escape sequences to reach the terminal emulator
set -g set-clipboard on

# don't rename windows automatically
set-option -g allow-rename off

# start from 1 for indexes
set -g base-index 1

# set a main-vertical layout
bind m select-layout main-vertical

# shorten command delay
set -s escape-time 0

### status bar stuff

# Gruvbox dark palette
set -g status-interval 5
set -g status-style "bg=#282828,fg=#ebdbb2"

# Left: session name — turns bright red/inverted when prefix is active
set -g status-left-length 20
set -g status-left "#{?client_prefix,#[bg=#cc241d]#[fg=#282828] PRFX #[bg=#282828]#[fg=#cc241d],#[bg=#d79921]#[fg=#282828]} #S #[bg=#282828,fg=#d79921]#[default]"

# Right: git branch + date/time
set -g status-right-length 100
set -g status-right "#[fg=#928374]#(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/#[fg=#b8bb26] /') #[fg=#928374]│ #[fg=#83a598]%Y-%m-%d #[fg=#ebdbb2]%H:%M "

# Window list
setw -g window-status-current-style "bg=#d65d0e,fg=#282828,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-style "fg=#928374"
setw -g window-status-format " #I:#W "

# Pane borders — also flash on prefix for extra visibility
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d79921"
set -g pane-border-format ""

# Message/command line styling
set -g message-style "bg=#3c3836,fg=#ebdbb2"
