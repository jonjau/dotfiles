# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file with r (change file location to your the tmux.conf you want to use)
bind r source ~/.config/tmux/tmux.conf\; display "tmux.conf sourced!"

# switch panes using vim motions
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# vi keybindings for copy mode
set -g mode-keys vi

# on mouse release in copy mode, copy to tmux buffer and system clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

# allow OSC 52 clipboard escape sequences to reach the terminal emulator
set -g set-clipboard on

# don't rename windows automatically
set-option -g allow-rename off

# start from 1 for indexes
set -g base-index 1

# set a main-vertical layout
bind m select-layout main-vertical

# shorten command delay
set -s escape-time 0

### status bar stuff

# Creamy Forest palette (Noctalia)
set -g status-interval 5
set -g status-style "bg=#1c1e1a,fg=#f4f6eb"

# Left: session name — turns bright red/inverted when prefix is active
set -g status-left-length 20
set -g status-left "#{?client_prefix,#[bg=#ce7a71]#[fg=#131411] PRFX #[bg=#1c1e1a]#[fg=#ce7a71],#[bg=#a2b08d]#[fg=#131411]} #S #[bg=#1c1e1a,fg=#a2b08d]#[default]"

# Right: git branch + date/time
set -g status-right-length 100
set -g status-right "#[fg=#948e74]#(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/#[fg=#a2b08d] /') #[fg=#948e74]│ #[fg=#6f8796]%Y-%m-%d #[fg=#f4f6eb]%H:%M "

# Window list
setw -g window-status-current-style "bg=#6e857b,fg=#f4f6eb,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-style "fg=#948e74"
setw -g window-status-format " #I:#W "

# Pane borders — also flash on prefix for extra visibility
set -g pane-border-style "fg=#343730"
set -g pane-active-border-style "fg=#a2b08d"
set -g pane-border-format ""

# Message/command line styling
set -g message-style "bg=#252722,fg=#f4f6eb"
